<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 AI promptova — Arhiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16112e;
    --purple-deep: #241a5e;
    --purple: #4b3fb0;
    --purple-light: #8c64e6;
    --off-white: #f3f1fa;
    --grey: #a79fc9;
    --amber: #f0b940;
    --line: #2a2350;
    --card: rgba(255,255,255,0.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .display { font-family: 'Sora', sans-serif; }
  .bg-glow {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 15% 0%, rgba(140,100,230,0.18), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(75,63,176,0.22), transparent 45%);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 18px 60px; }
  a.back { color: var(--grey); text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 18px; }

  .brandline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--grey); margin-bottom: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple-light); display: inline-block; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; }
  #langBtn {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 8px; font-size: 11px; font-weight: 600; padding: 5px 9px;
    cursor: pointer; color: var(--off-white); font-family: 'Inter', sans-serif;
  }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.3px; margin: 10px 0 8px; line-height: 1.1; }
  .sub { font-size: 13.5px; color: var(--grey); margin-bottom: 18px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    padding: 9px 16px; border: none; border-radius: 10px; font-weight: 600; font-size: 13px;
    cursor: pointer; background: rgba(255,255,255,0.04); color: var(--grey); font-family: 'Inter', sans-serif;
  }
  .tab-btn.active { background: linear-gradient(135deg, var(--purple-light), var(--purple)); color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; }

  .cat-card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .cat-head { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .cat-head span.name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13.5px; }
  .badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .badge.free { background: rgba(140,100,230,0.15); color: var(--purple-light); }
  .badge.locked { background: rgba(240,185,64,0.12); color: var(--amber); }

  .prompt-list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .prompt-text { font-size: 12.5px; line-height: 1.55; }
  .prompt-text .ph { color: var(--amber); }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    background: transparent; border: 1px solid var(--line); color: var(--grey);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .copy-btn.copied { background: rgba(140,100,230,0.15); border-color: var(--purple-light); color: var(--purple-light); }

  .locked-wrap { position: relative; padding: 14px; }
  .blurred { filter: blur(4px); user-select: none; opacity: 0.5; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; }
  .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .lock-pill { display: flex; align-items: center; gap: 6px; background: rgba(22,17,46,0.9); border: 1px solid var(--line); border-radius: 8px; color: var(--grey); font-size: 11px; font-weight: 600; padding: 5px 11px; }
  .unlock-link { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--amber); text-decoration: none; background: rgba(22,17,46,0.9); padding: 6px 12px; border-radius: 8px; }

  .type-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .type-btn { padding: 6px 11px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--grey); font-family: 'Inter', sans-serif; }
  .type-btn.active { border-color: var(--purple-light); background: rgba(140,100,230,0.15); color: var(--purple-light); }

  .example-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; background: transparent; border: 1px dashed var(--line); border-radius: 8px; color: var(--grey); font-size: 12px; font-weight: 600; padding: 8px 0; cursor: pointer; margin-bottom: 14px; font-family: 'Inter', sans-serif; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--grey); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 11px; font-size: 13px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--line); border-radius: 8px; color: var(--off-white); font-family: 'Inter', sans-serif;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .gen-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: linear-gradient(135deg, var(--amber), #e79b2a); color: #241705; border: none;
    border-radius: 10px; padding: 12px 0; font-weight: 700; font-size: 14px; cursor: pointer;
    margin-bottom: 14px; font-family: 'Inter', sans-serif;
  }

  .output-box { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .output-label { font-size: 11px; color: var(--grey); margin-bottom: 8px; font-weight: 600; }
  #outputText { font-size: 13px; line-height: 1.6; color: var(--off-white); margin-bottom: 12px; }
  #outputText.empty { color: var(--grey); font-size: 12.5px; }
  .footer-note { font-size: 11.5px; color: var(--grey); text-align: center; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">
  <a class="back" href="index.html">← Nazad na portfolio</a>

  <div class="top-row">
    <p class="brandline"><span class="dot"></span><span id="brandlineText">dzofficial / alati</span></p>
    <button id="langBtn" onclick="toggleLang()">EN</button>
  </div>
  <h1 class="display" id="titleText">50 AI promptova</h1>
  <p class="sub" id="subText">Arhiva gotovih promptova za reklame i marketing copy — pretraži paket ili sastavi svoj.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabBrowseBtn" onclick="switchTab('browse')"></button>
    <button class="tab-btn" id="tabGenBtn" onclick="switchTab('generator')"></button>
  </div>

  <div class="panel active" id="browsePanel"></div>

  <div class="panel" id="generatorPanel">
    <div class="type-row" id="typeRow"></div>
    <button class="example-btn" id="exampleBtn" onclick="fillExample()">🎲 <span id="exampleBtnText">Popuni primer</span></button>

    <div class="field">
      <label id="lblProduct">Proizvod/usluga</label>
      <input id="product" placeholder="npr. online kurs fotografije">
    </div>
    <div class="row2">
      <div class="field">
        <label id="lblAudience">Ciljna grupa</label>
        <input id="audience" placeholder="npr. početnike u fotografiji">
      </div>
      <div class="field">
        <label id="lblTone">Ton</label>
        <select id="tone"></select>
      </div>
    </div>
    <div class="field">
      <label id="lblBenefit">Glavna korist</label>
      <input id="benefit" placeholder="npr. da uštede 5 sati nedeljno">
    </div>
    <div class="field">
      <label id="lblExtra">Dodatna napomena (opciono)</label>
      <input id="extra" placeholder="npr. da spomene popust od 20%">
    </div>

    <button class="gen-btn" onclick="generatePrompt()">✨ <span id="genBtnText">Sastavi prompt</span></button>

    <div class="output-box">
      <div class="output-label" id="lblOutput">Tvoj prompt</div>
      <div id="outputText" class="empty">Popuni polja i klikni „Sastavi prompt”.</div>
      <button class="copy-btn" id="copyOutputBtn" onclick="copyOutput()" style="display:none;">
        <span id="copyOutputIcon">⧉</span> <span id="copyOutputText">Kopiraj</span>
      </button>
    </div>
    <p class="footer-note" id="footerNote">Isti promptovi kao u punom paketu od 50 — ovo je samo deo.</p>
  </div>
</div>

<script>

const TEMPLATES = {

let lang = "sr";
let currentType = "fb";

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlight(text) { return esc(text).replace(/(\[[^\]]+\])/g, '<span class="ph">$1</span>'); }

function renderStatic() {
  const t = T[lang];
  document.getElementById('brandlineText').textContent = t.brandline;
  document.getElementById('titleText').textContent = t.title;
  document.getElementById('subText').textContent = t.sub;
  document.getElementById('tabBrowseBtn').textContent = t.tabBrowse;
  document.getElementById('tabGenBtn').textContent = t.tabGen;
  document.getElementById('lblProduct').textContent = t.product;
  document.getElementById('lblAudience').textContent = t.audience;
  document.getElementById('lblTone').textContent = t.tone;
  document.getElementById('lblBenefit').textContent = t.benefit;
  document.getElementById('lblExtra').textContent = t.extra;
  document.getElementById('exampleBtnText').textContent = t.example;
  document.getElementById('genBtnText').textContent = t.generate;
  document.getElementById('lblOutput').textContent = t.output;
  document.getElementById('footerNote').textContent = t.footer;
  document.getElementById('product').placeholder = t.productPh;
  document.getElementById('audience').placeholder = t.audiencePh;
  document.getElementById('benefit').placeholder = t.benefitPh;
  document.getElementById('extra').placeholder = t.extraPh;
  document.querySelector('a.back').textContent = t.back;
  document.getElementById('langBtn').textContent = lang === 'sr' ? 'EN' : 'SR';

  const toneSel = document.getElementById('tone');
  toneSel.innerHTML = TONES[lang].map(([v,l]) => `<option value="${v}">${l}</option>`).join('');

  const typeRow = document.getElementById('typeRow');
  typeRow.innerHTML = GEN_TYPES[lang].map(([v,l]) =>
    `<button class="type-btn${v===currentType?' active':''}" onclick="switchType('${v}')">${l}</button>`
  ).join('');

  resetOutput();
}

function renderBrowse() {
  const t = T[lang];
  const cats = CATEGORIES[lang];
  const html = cats.map(cat => {
    if (cat.free) {
      const shown = cat.prompts.slice(0, 3);
      return `<div class="cat-card">
        <div class="cat-head"><span class="name">${esc(cat.name)}</span><span class="badge free">${t.free}</span></div>
        <div class="prompt-list">
          ${shown.map(p => `<div>
            <div class="prompt-text">${highlight(p)}</div>
            <button class="copy-btn" onclick="copyPrompt(this, \`${p.replace(/`/g,"'")}\`)">⧉ ${t.copy}</button>
          </div>`).join('')}
        </div>
      </div>`;
    } else {
      const preview = cat.prompts.slice(0, 2).map(p => `<div>${esc(p)}</div>`).join('');
      return `<div class="cat-card">
        <div class="cat-head"><span class="name">${esc(cat.name)}</span><span class="badge locked">${t.locked}</span></div>
        <div class="locked-wrap">
          <div class="blurred">${preview}</div>
          <div class="lock-overlay">
            <div class="lock-pill">🔒 ${cat.prompts.length}</div>
            <a class="unlock-link" href="${GUMROAD[lang]}" target="_blank" rel="noopener">${t.unlock}</a>
          </div>
        </div>
      </div>`;
    }
  }).join('');
  document.getElementById('browsePanel').innerHTML = html;
}

function copyPrompt(btn, text) {
  copyToClipboard(text);
  const original = btn.innerHTML;
  btn.innerHTML = '✓ ' + T[lang].copied;
  btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1500);
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.focus();
  el.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(el);
}

function switchTab(tab) {
  document.getElementById('browsePanel').classList.toggle('active', tab === 'browse');
  document.getElementById('generatorPanel').classList.toggle('active', tab === 'generator');
  document.getElementById('tabBrowseBtn').classList.toggle('active', tab === 'browse');
  document.getElementById('tabGenBtn').classList.toggle('active', tab === 'generator');
}

function switchType(v) {
  currentType = v;
  document.querySelectorAll('.type-btn').forEach((btn, i) => {
    btn.classList.toggle('active', GEN_TYPES[lang][i][0] === v);
  });
  resetOutput();
}

function fillExample() {
  const list = EXAMPLES[lang][currentType];
  const ex = list[Math.floor(Math.random() * list.length)];
  document.getElementById('product').value = ex.product;
  document.getElementById('audience').value = ex.audience;
  document.getElementById('tone').value = ex.tone;
  document.getElementById('benefit').value = ex.benefit;
  document.getElementById('extra').value = ex.extra;
  resetOutput();
}

function resetOutput() {
  const t = T[lang];
  const out = document.getElementById('outputText');
  out.textContent = t.empty;
  out.classList.add('empty');
  document.getElementById('copyOutputBtn').style.display = 'none';
}

function generatePrompt() {
  const t = T[lang];
  const toneVal = document.getElementById('tone').value;
  const toneLabel = (TONES[lang].find(x => x[0] === toneVal) || [,toneVal])[1].toLowerCase();
  const productVal = document.getElementById('product').value.trim() || t.yourPh;
  const audienceVal = document.getElementById('audience').value.trim() || t.targetPh;
  const benefitVal = document.getElementById('benefit').value.trim() || t.benefitPh2;
  const extraVal = document.getElementById('extra').value.trim();
  const extra = extraVal ? `${t.extraNote}${extraVal}.` : '';

  const text = TEMPLATES[lang][currentType]({ product: productVal, audience: audienceVal, tone: toneLabel, benefit: benefitVal, extra });

  const out = document.getElementById('outputText');
  out.textContent = text;
  out.classList.remove('empty');
  document.getElementById('copyOutputBtn').style.display = 'inline-flex';
  document.getElementById('copyOutputBtn').onclick = () => copyPrompt(document.getElementById('copyOutputBtn'), text);
}

function toggleLang() {
  lang = lang === 'sr' ? 'en' : 'sr';
  document.documentElement.lang = lang;
  renderStatic();
  renderBrowse();
}

renderStatic();
renderBrowse();
</script>
